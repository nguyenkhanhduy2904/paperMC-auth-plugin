name: MinecraftAuth
version: '1.0-SNAPSHOT'

main: me.duy.minecraftauth.MinecraftAuth
api-version: '1.21.4'
load: POSTWORLD

authors: [ NguyenKhanhDuy ]

commands:
  login:
    description: Login to your account
    usage: /login <password>

  register:
    description: Register an account
    usage: /register <password>

  restrict:
    description: Restrict a player
    usage: /restrict <player>
    permission: minecraftauth.restrict

  unrestrict:
    description: Unrestrict a player
    usage: /unrestrict <player>
    permission: minecraftauth.restrict

permissions:
  minecraftauth.restrict:
    description: Allows restricting and unrestricting players
    default: op